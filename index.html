<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Client-Server Application</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="CSS-Reset.css">
    </head>
    <body>
        <main class="container">
            <div>
                <h1>Email Services</h1>
                <p id="welcome-message">Loading user information...</p>
                <hr>
            </div>
            <div class="divData">
                <h2>External Data</h2>
                <button id="requestData">Request Data</button>
                  <div id="data">
                  </div>
            </div>
            <p id="db-results"></p>
            <div>
                <h2>Send an Email</h2>
                <form id="myForm" action="send-email.php" method="post">
                    <div class="formBody">
                        <label for="email">To:</label>
                        <input type="email" id="email" name="email" placeholder="someone@example.com" maxlength="254" required>
                    </div>
                    <div class="formBody">
                        <label for="Ccemail">Cc:</label>
                        <input type="email" id="ccEmail" name="ccEmail" placeholder="someone@example.com" maxlength="254">
                    </div>
                    <div class="formBody">
                        <label for="subjectLine">Subject:</label>
                        <input type="text" id="subject" name="subject" placeholder="Add a subject" maxlength="255" required>
                    </div>
                    <textarea id="message" name="message" placeholder="Type your message here..." required minlength="20" maxlength="5000"></textarea>
                    <input id="button" type="submit" value="Send Email">
                </form>
            </div>
        </main>
        <script src="index.js" defer> </script>
    </body>
</html>
